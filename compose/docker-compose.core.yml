# i-lab :: núcleo — LiteLLM (proxy de modelos) + PostgreSQL + Redis
# Uso: make core   |   docker compose -f compose/docker-compose.core.yml --env-file secrets/.env up -d
name: ilab-core

networks:
  ilab-net:
    external: true

volumes:
  postgres-data:
  redis-data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: ilab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ilab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en secrets/.env}
      POSTGRES_DB: ${POSTGRES_DB:-ilab}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ilab} -d ${POSTGRES_DB:-ilab}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ilab-net]

  redis:
    image: redis:7-alpine
    container_name: ilab-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?falta REDIS_PASSWORD en secrets/.env}"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ilab-net]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ilab-litellm
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["--config", "/app/config/litellm.config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?falta LITELLM_MASTER_KEY en secrets/.env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?falta LITELLM_SALT_KEY en secrets/.env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ilab}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ilab}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Claves de proveedores (ver secrets/.env.example)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Trazas hacia Langfuse (stack obs, opcional)
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    volumes:
      - ../config/litellm.config.yaml:/app/config/litellm.config.yaml:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health/liveliness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [ilab-net]
