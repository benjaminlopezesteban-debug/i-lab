# i-lab :: pasarelas de mensajería — Telegram y WhatsApp hacia el agente
# Cada gateway es un servicio propio; se construyen desde config/gateway/.
name: ilab-gateway

networks:
  ilab-net:
    external: true

services:
  telegram-gateway:
    build:
      context: ../config/gateway/telegram
    image: ilab/telegram-gateway:local
    container_name: ilab-gw-telegram
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?falta TELEGRAM_BOT_TOKEN en secrets/.env}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://openhands:3000}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    volumes:
      - ../config/gateway/telegram:/app/config:ro
      - ../agents:/app/agents:ro
    networks: [ilab-net]

  whatsapp-gateway:
    build:
      context: ../config/gateway/whatsapp
    image: ilab/whatsapp-gateway:local
    container_name: ilab-gw-whatsapp
    restart: unless-stopped
    environment:
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ALLOWED_NUMBERS: ${WHATSAPP_ALLOWED_NUMBERS:-}
      AGENT_BASE_URL: ${AGENT_BASE_URL:-http://openhands:3000}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
    volumes:
      - ../config/gateway/whatsapp:/app/config:ro
      - ../agents:/app/agents:ro
    ports:
      - "${WHATSAPP_WEBHOOK_PORT:-8081}:8080"
    networks: [ilab-net]
