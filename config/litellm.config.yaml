# i-lab :: LiteLLM — un solo endpoint OpenAI-compatible para todo el laboratorio.
# Los clientes (OpenHands, gateways, scripts) apuntan a http://litellm:4000
# y usan LITELLM_MASTER_KEY; las claves reales de proveedor viven en secrets/.env.

model_list:
  # --- Anthropic ---------------------------------------------------------
  - model_name: opus-5
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- OpenAI ------------------------------------------------------------
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # --- Google ------------------------------------------------------------
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # --- Modelos locales (Ollama en el host) --------------------------------
  - model_name: local-qwen
    litellm_params:
      model: ollama/qwen2.5-coder:14b
      api_base: http://host.docker.internal:11434

# Alias: el resto del laboratorio pide estos nombres genéricos.
router_settings:
  routing_strategy: simple-shuffle
  redis_host: redis
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD

litellm_settings:
  drop_params: true
  set_verbose: false
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    ttl: 3600
  # Trazas hacia Langfuse (stack obs). Sin claves, LiteLLM lo ignora.
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # Presupuesto mensual del laboratorio, en USD.
  max_budget: 50
  budget_duration: 30d
