# i-lab :: Prometheus — scrape del proxy y de los servicios que exponen /metrics
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    lab: i-lab

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ["litellm:4000"]

  - job_name: langfuse
    metrics_path: /api/public/metrics
    static_configs:
      - targets: ["langfuse:3000"]
